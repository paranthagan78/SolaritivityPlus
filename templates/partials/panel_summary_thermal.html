<!-- ══════════════════════════════════════════
     PANEL: THERMAL SUMMARY
══════════════════════════════════════════ -->
<div class="panel" id="panel-summary-thermal">

    <!-- ── Fullscreen Loading Overlay ── -->
    <div id="thermalSummaryOverlay" class="summary-overlay" style="display:none">
        <div class="overlay-content">
            <svg class="sun-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="18" fill="#f59e0b" />
                <g stroke="#f59e0b" stroke-width="3" stroke-linecap="round">
                    <line x1="50" y1="5" x2="50" y2="20" />
                    <line x1="50" y1="80" x2="50" y2="95" />
                    <line x1="5" y1="50" x2="20" y2="50" />
                    <line x1="80" y1="50" x2="95" y2="50" />
                    <line x1="18" y1="18" x2="28" y2="28" />
                    <line x1="72" y1="72" x2="82" y2="82" />
                    <line x1="82" y1="18" x2="72" y2="28" />
                    <line x1="28" y1="72" x2="18" y2="82" />
                </g>
            </svg>
            <div class="overlay-text">Analyzing Thermal Data…</div>
        </div>
    </div>

    <!-- ── Hero: Initial State ── -->
    <div id="thermalSummaryHero" class="summary-hero">
        <div class="hero-glow"></div>
        <div class="hero-label">AI-Powered Thermal Inspection Report</div>
        <button class="summary-orb" onclick="runThermalSummary()" id="thermalSummaryOrbBtn">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="orb-sun">
                <circle cx="50" cy="50" r="18" fill="#e74c3c" />
                <g stroke="#e74c3c" stroke-width="2.5" stroke-linecap="round">
                    <line x1="50" y1="10" x2="50" y2="22" />
                    <line x1="50" y1="78" x2="50" y2="90" />
                    <line x1="10" y1="50" x2="22" y2="50" />
                    <line x1="78" y1="50" x2="90" y2="50" />
                    <line x1="22" y1="22" x2="30" y2="30" />
                    <line x1="70" y1="70" x2="78" y2="78" />
                    <line x1="78" y1="22" x2="70" y2="30" />
                    <line x1="30" y1="70" x2="22" y2="78" />
                </g>
            </svg>
            <span class="orb-label">Generate<br>Thermal Report</span>
        </button>
        <div class="hero-hint">Based on hotspots and LIME analysis</div>

        <div class="summary-actions">
            <button class="action-pill action-pill-pdf" onclick="showPdfModalThermal()" id="pdfBtnThermal">
                <span class="pill-text">Download PDF Report</span>
            </button>
        </div>
    </div>

    <!-- ── Report Display ── -->
    <div id="thermalSummaryReport" class="summary-report" style="display:none">
        <div class="report-header">
            <div class="report-header-left">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="32" height="32">
                    <circle cx="50" cy="50" r="18" fill="#e74c3c" />
                    <g stroke="#e74c3c" stroke-width="3" stroke-linecap="round">
                        <line x1="50" y1="5" x2="50" y2="20" />
                        <line x1="50" y1="80" x2="50" y2="95" />
                        <line x1="5" y1="50" x2="20" y2="50" />
                        <line x1="80" y1="50" x2="95" y2="50" />
                        <line x1="18" y1="18" x2="28" y2="28" />
                        <line x1="72" y1="72" x2="82" y2="82" />
                        <line x1="82" y1="18" x2="72" y2="28" />
                        <line x1="28" y1="72" x2="18" y2="82" />
                    </g>
                </svg>
                <span>Solar Thermal Inspection Report</span>
            </div>
            <div class="report-header-actions">
                <button class="action-pill action-pill-pdf action-pill-sm" onclick="showPdfModalThermal()">
                    <span class="pill-text">PDF</span>
                </button>
                <button class="action-pill action-pill-sm" onclick="regenerateThermalSummary()">
                    <span class="pill-text">Regenerate</span>
                </button>
            </div>
        </div>
        <div id="thermalReportSections"></div>
    </div>

</div><!-- /panel-summary-thermal -->
